name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: python -m pip install build ruff
      - name: Lint
        run: ruff check src test
      - name: Check formatting
        run: ruff format --check src test
      - name: Build distributions
        run: python -m build
      - name: Check license in distributions
        run: |
          tar -tzf dist/*.tar.gz | grep -E '/LICENSE$'
          unzip -l dist/*.whl | grep -E '\.dist-info/licenses/LICENSE$'

  ebsd-full-stack:
    name: EBSD CTF to FESTIM transport (full stack)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: festim-microstructure
          auto-activate-base: false
      - name: Install package without replacing the solver stack
        run: python -m pip install --no-deps -e .
      - name: Run the complete test suite
        env:
          FM_REQUIRE_FULL_STACK: "1"
        run: python -m pytest -q
