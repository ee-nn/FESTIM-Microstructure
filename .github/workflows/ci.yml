name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: python -m pip install build ruff
      - name: Lint
        run: ruff check src test
      - name: Check formatting
        run: ruff format --check src test
      - name: Build distributions
        run: python -m build
      - name: Check license in distributions
        run: |
          tar -tzf dist/*.tar.gz | grep -E '/LICENSE$'
          unzip -l dist/*.whl | grep -E '\.dist-info/licenses/LICENSE$'

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib meshio pillow pytest pytest-cov
          python -m pip install --no-deps -e .
      - name: Run tests
        run: pytest

  upxo:
    name: UPXO geometry and worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Gmsh runtime
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install evaluated UPXO and package
        run: |
          python -m pip install "upxo[ebsd] @ git+https://github.com/Design-By-Fundamentals-UKAEA/UPXO.git@a53885ef0a7a06f6b3fb195747363ae0a19bb127" gmsh==4.15.2 meshio==5.3.5 rasterio==1.5.2 pytest
          python -m pip install --no-deps -e .
      - name: Run geometry and real worker tests
        run: pytest test/test_upxo_backend.py test/test_upxo_evaluation.py test/test_format_pipeline.py test/test_upxo_import.py -q

  ebsd-full-stack:
    name: EBSD CTF to FESTIM transport (full stack)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment-festim-microstructure-upxo.yml
          activate-environment: festim-microstructure-upxo
          auto-activate-base: false
      - name: Install package without replacing the solver stack
        run: python -m pip install --no-deps -e .
      - name: Run required EBSD and solver integration tests
        env:
          FM_REQUIRE_FULL_STACK: "1"
        run: >-
          python -m pytest -q test/test_ebsd_si_mesh.py test/test_short_circuit.py
          test/test_subdomains.py test/test_gb_field.py test/test_gb_homogenisation.py
