# Conda environment for FESTIM-Microstructure: the FEniCSx / FESTIM side.
#
#   conda env create -f environment.yml
#   conda env create -f environment-neper.yml     # Neper, in its own env
#   conda activate festim-microstructure
#   pip install -e .
#   tools/link-neper-env.sh                       # tell this env where Neper is
#
# Neper is deliberately NOT in this file. On conda-forge, `neper` is built
# against `scotch 6.1.x`, which pins `zlib <1.3`, while `fenics-dolfinx >=0.10`
# needs `libzlib >=1.3.2` (through libadios2). The two cannot be solved into
# one environment. Neper is only ever run as a subprocess, so it lives in
# environment-neper.yml and this environment finds it through the FM_NEPER_BIN
# / FM_GMSH_BIN / FM_POVRAY_BIN variables (see festim_microstructure._binaries).
#
# Platforms: linux-64, osx-64, osx-arm64.
# Windows is not supported: neper has no win-64 build on conda-forge.
# Windows users should work inside WSL2.

name: festim-microstructure

channels:
  - conda-forge

dependencies:
  # ---- interpreter -------------------------------------------------------
  # FESTIM supports 3.9-3.13; 3.12 has the widest set of conda-forge builds
  # for the compiled dolfinx/scifem stack.
  - python=3.12
  - pip

  # ---- FEniCSx ------------------------------------------------------------
  # Pin the dolfinx minor series. FESTIM tracks the dolfinx ABI closely
  # (festim-dev/FESTIM#1173 moved FESTIM to dolfinx 0.11), so an unpinned
  # dolfinx will silently drift away from the pinned FESTIM below.
  # Widen or narrow this range when you bump the FESTIM pin.
  - fenics-dolfinx >=0.10,<0.12
  - fenics-ufl            # NOT `ufl` -- that name does not exist on conda-forge
  - fenics-basix
  - mpi4py
  - petsc4py

  # ---- FESTIM's own compiled dependencies ---------------------------------
  # Installed from conda-forge so that pip does not try to build scifem
  # from source against the conda dolfinx. FESTIM declares
  # tqdm, scifem>=0.20.0 and io4dolfinx[h5py].
  - scifem
  - io4dolfinx
  - h5py
  - tqdm

  # ---- meshing / microstructure generation --------------------------------
  # The Gmsh *Python API* is what meshing.voronoi needs (`import gmsh`); on
  # conda-forge that is `python-gmsh`, a separate package from the `gmsh`
  # executable. The executable that Neper calls comes from environment-neper.yml
  # and is reached through FM_GMSH_BIN, so the two Gmsh builds never mix.
  - python-gmsh
  - meshio
  # neper: see the header -- environment-neper.yml

  # ---- scientific stack ---------------------------------------------------
  - numpy
  - scipy
  - matplotlib
  - pillow                # EBSD check images (scale bars, border trimming)

  # ---- optional: visualisation -------------------------------------------
  - pyvista

  # ---- development --------------------------------------------------------
  - pytest
  - pytest-cov
  - ruff
  - ipykernel

  # ---- pip-only -----------------------------------------------------------
  - pip:
      # FESTIM 2.1 / 2.2rc* are not on conda-forge yet (newest there is
      # 2.0b2.post2), so this must come from PyPI. Note the canonical
      # spelling is `2.2rc2`, not `2.2.0rc2`.
      # If pip tries to build scifem from source here, the conda scifem above
      # is too old for this FESTIM pin -- either relax the FESTIM pin or
      # install with: pip install --no-deps festim==2.2rc2
      - festim==2.2rc2